<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Color Mapper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79b8ff;
}

body {
  font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem;
}

header {
  margin-bottom: 2rem;
}

h1 {
  font-size: 1.75rem;
  font-weight: 600;
  margin: 0 0 0.25rem 0;
  color: var(--text);
}

.subtitle {
  color: var(--muted);
  font-size: 0.9rem;
  margin: 0;
}

.controls {
  margin-bottom: 1.5rem;
}

.control-group {
  margin-bottom: 1rem;
}

.control-group label {
  display: block;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.5rem;
}

#textInput {
  width: 100%;
  min-height: 120px;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  resize: vertical;
}

#textInput:focus {
  outline: none;
  border-color: var(--accent);
}

#modeSelect,
#canvasShape,
#arrangementPattern,
#rgb3DShape {
  width: 100%;
  max-width: 100%;
  padding: 0.5rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}

#modeSelect:focus,
select:focus {
  outline: none;
  border-color: var(--accent);
}

#pixelSize,
#similarityThreshold,
#trendMinLength,
#trendSimilarity,
#trendOpacity,
#pointSize3D,
#plotSpeed3D {
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: var(--surface);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

#pixelSize::-webkit-slider-thumb,
#similarityThreshold::-webkit-slider-thumb,
#trendMinLength::-webkit-slider-thumb,
#trendSimilarity::-webkit-slider-thumb,
#trendOpacity::-webkit-slider-thumb,
#pointSize3D::-webkit-slider-thumb,
#plotSpeed3D::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

#pixelSize::-moz-range-thumb,
#similarityThreshold::-moz-range-thumb,
#trendMinLength::-moz-range-thumb,
#trendSimilarity::-moz-range-thumb,
#trendOpacity::-moz-range-thumb,
#pointSize3D::-moz-range-thumb,
#plotSpeed3D::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
}

#pixelSizeValue,
#similarityThresholdValue,
#pointSize3DValue,
#plotSpeed3DValue {
  color: var(--accent);
  font-weight: 500;
}

#emphasizeSimilarity,
#highlightTrends,
#view3D,
#exportVideo3D,
#showLines3D,
#viewRGB3D,
#rgb3DShowPath,
#trendHorizontal,
#trendVertical,
#trendDiagonal {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--accent);
}

#similarityThresholdGroup {
  padding: 1rem;
  padding-left: 1rem;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 8px;
  margin-top: 0.5rem;
}

#similarityThresholdGroup label {
  margin-bottom: 0.5rem;
}

#similarityThresholdGroup small {
  color: var(--muted);
  display: block;
  margin-top: 4px;
  font-size: 0.8rem;
}

#similarityThresholdValue {
  color: var(--accent);
  font-weight: 500;
}

#trendControlsGroup {
  padding: 1rem;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 8px;
  margin-top: 0.5rem;
}

#trendControlsGroup label {
  margin-bottom: 0.5rem;
}

#trendControlsGroup input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--accent);
  margin-right: 8px;
}

#trendControlsGroup input[type="range"] {
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: var(--surface);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  margin-top: 5px;
}

#trendControlsGroup input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

#trendControlsGroup input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
}

#trendMinLengthValue,
#trendSimilarityValue,
#trendOpacityValue {
  color: var(--accent);
  font-weight: 500;
}

#highlightColor {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  background: var(--surface);
}

#view3DControlsGroup,
#rgb3DControlsGroup {
  padding: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 0.5rem;
}

#view3DControlsGroup label,
#rgb3DControlsGroup label {
  margin-bottom: 0.5rem;
}

#videoExportControls {
  margin-top: 0.75rem;
}

#startVideoExportBtn {
  padding: 0.5rem 1rem;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  font-weight: 500;
  margin-top: 0.5rem;
}

#startVideoExportBtn:hover {
  background: var(--accent-hover);
}

.button-group {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-top: 1.5rem;
}

button {
  padding: 0.5rem 1rem;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  font-weight: 500;
  min-width: 140px;
}

#randomizeBtn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

#randomizeBtn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

#exportImageBtn {
  background: var(--accent);
  color: var(--bg);
  border: none;
}

#exportImageBtn:hover {
  background: var(--accent-hover);
}

#downloadJsonBtn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

#downloadJsonBtn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.canvas-container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: auto;
  max-height: 70vh;
}

#colorCanvas {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  display: block;
}

#canvas3D,
#canvasRGB3D {
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.control-group input[type="checkbox"] + label,
.control-group label:has(input[type="checkbox"]) {
  display: inline-flex;
  align-items: center;
  margin-bottom: 0;
  cursor: pointer;
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Token Color Mapper</h1>
            <p class="subtitle">Map text tokens to colors and visualize as pixels</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="textInput">Enter Text:</label>
                <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
            </div>
            
            <div class="control-group">
                <label for="modeSelect">Color Mapping Mode:</label>
                <select id="modeSelect">
                    <option value="standard">Standard (Deterministic)</option>
                    <option value="random">Random</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="pixelSize">Pixel Size: <span id="pixelSizeValue">10</span>px</label>
                <input type="range" id="pixelSize" min="1" max="50" value="10">
            </div>
            
            <div class="control-group">
                <label for="canvasShape">Canvas Shape:</label>
                <select id="canvasShape">
                    <option value="square">Square Grid</option>
                    <option value="rectangle">Rectangle (Wide)</option>
                    <option value="tall">Rectangle (Tall)</option>
                    <option value="circle">Circle</option>
                    <option value="spiral">Spiral</option>
                    <option value="triangle">Triangle</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="arrangementPattern">Arrangement Pattern:</label>
                <select id="arrangementPattern">
                    <option value="row-major">Row Major (Left to Right, Top to Bottom)</option>
                    <option value="column-major">Column Major (Top to Bottom, Left to Right)</option>
                    <option value="spiral-in">Spiral Inward</option>
                    <option value="spiral-out">Spiral Outward</option>
                    <option value="zigzag">Zigzag (Row)</option>
                    <option value="zigzag-col">Zigzag (Column)</option>
                    <option value="diagonal">Diagonal (Top-Left to Bottom-Right)</option>
                    <option value="random">Random</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="emphasizeSimilarity" style="margin-right: 8px;">
                    Emphasize Color Similarity
                </label>
            </div>
            
            <div class="control-group" id="similarityThresholdGroup" style="display: none;">
                <label for="similarityThreshold">Similarity Threshold: <span id="similarityThresholdValue">50</span>%</label>
                <input type="range" id="similarityThreshold" min="0" max="100" value="50">
                <small style="color: #666; display: block; margin-top: 4px;">Lower values group more similar colors together</small>
            </div>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="highlightTrends" style="margin-right: 8px;">
                    Highlight Pixel Trends
                </label>
            </div>
            
            <div class="control-group" id="trendControlsGroup" style="display: none;">
                <div style="margin-bottom: 10px;">
                    <label style="display: flex; align-items: center; margin-bottom: 8px;">
                        <input type="checkbox" id="trendHorizontal" checked style="margin-right: 8px;">
                        Horizontal
                    </label>
                    <label style="display: flex; align-items: center; margin-bottom: 8px;">
                        <input type="checkbox" id="trendVertical" checked style="margin-right: 8px;">
                        Vertical
                    </label>
                    <label style="display: flex; align-items: center; margin-bottom: 8px;">
                        <input type="checkbox" id="trendDiagonal" checked style="margin-right: 8px;">
                        Diagonal
                    </label>
                </div>
                
                <label for="trendMinLength">Minimum Trend Length: <span id="trendMinLengthValue">3</span> pixels</label>
                <input type="range" id="trendMinLength" min="2" max="10" value="3">
                
                <label for="trendSimilarity" style="margin-top: 10px;">Trend Similarity Threshold: <span id="trendSimilarityValue">30</span>%</label>
                <input type="range" id="trendSimilarity" min="0" max="100" value="30">
                
                <label for="trendOpacity" style="margin-top: 10px;">Highlight Opacity: <span id="trendOpacityValue">50</span>%</label>
                <input type="range" id="trendOpacity" min="0" max="100" value="50">
                
                <label for="highlightColor" style="margin-top: 10px;">Highlight Color:</label>
                <input type="color" id="highlightColor" value="#ffff00" style="width: 100%; height: 40px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer;">
            </div>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="view3D" style="margin-right: 8px;">
                    Enable 3D View
                </label>
            </div>
            
            <div class="control-group" id="view3DControlsGroup" style="display: none;">
                <label for="pointSize3D">Point Size: <span id="pointSize3DValue">0.1</span></label>
                <input type="range" id="pointSize3D" min="0.01" max="0.5" step="0.01" value="0.1">
                
                <label style="margin-top: 10px;">
                    <input type="checkbox" id="showLines3D" style="margin-right: 8px;">
                    Show Plotting Path Lines
                </label>
                
                <label style="margin-top: 10px;">
                    <input type="checkbox" id="exportVideo3D" style="margin-right: 8px;">
                    Export Video (Animated Plotting)
                </label>
                
                <div id="videoExportControls" style="display: none; margin-top: 10px;">
                    <label for="plotSpeed3D">Plotting Speed: <span id="plotSpeed3DValue">1</span> points/frame</label>
                    <input type="range" id="plotSpeed3D" min="0.1" max="10" step="0.1" value="1">
                    <button id="startVideoExportBtn" style="margin-top: 10px; padding: 8px 16px; background: #4facfe; color: white; border: none; border-radius: 4px; cursor: pointer;">Start Video Export</button>
                </div>
            </div>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="viewRGB3D" style="margin-right: 8px;">
                    Enable RGB 3D View (Color Space)
                </label>
            </div>
            
            <div class="control-group" id="rgb3DControlsGroup" style="display: none;">
                <label for="rgb3DShape">Point Shape:</label>
                <select id="rgb3DShape">
                    <option value="sphere">Sphere</option>
                    <option value="cube">Cube</option>
                </select>
                
                <label style="margin-top: 10px;">
                    <input type="checkbox" id="rgb3DShowPath" style="margin-right: 8px;">
                    Show Plotting Path
                </label>
            </div>
            
            <div class="button-group">
                <button id="randomizeBtn">Re-randomize Colors</button>
                <button id="exportImageBtn">Export High-Res Image</button>
                <button id="downloadJsonBtn">Download Color Mapping (JSON)</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="colorCanvas"></canvas>
            <div id="canvas3D" style="display: none; width: 100%; height: 600px;"></div>
            <div id="canvasRGB3D" style="display: none; width: 100%; height: 600px;"></div>
        </div>
    </div>
    
    <script>
// State management
let tokenColorMap = new Map();
let currentMode = 'standard';
let pixelSize = 10;
let tokens = [];
let emphasizeSimilarity = false;
let similarityThreshold = 50;
let highlightTrends = false;
let trendHorizontal = true;
let trendVertical = true;
let trendDiagonal = true;
let trendMinLength = 3;
let trendSimilarity = 30;
let trendOpacity = 50;
let highlightColorHex = '#ffff00';
let canvasShape = 'square';
let arrangementPattern = 'row-major';
let pixelPositions = [];
let view3D = false;
let scene3D, camera3D, renderer3D, controls3D;
let pointSize3D = 0.1;
let showLines3D = false;
let exportVideo3D = false;
let plotSpeed3D = 1;
let viewRGB3D = false;
let sceneRGB3D, cameraRGB3D, rendererRGB3D, controlsRGB3D;
let rgb3DShape = 'sphere';
let rgb3DShowPath = false;
let animationIdRGB3D;
let isRecordingVideo = false;
let mediaRecorder = null;
let recordedChunks = [];
let animationFrameId = null;

// DOM elements
const textInput = document.getElementById('textInput');
const modeSelect = document.getElementById('modeSelect');
const pixelSizeSlider = document.getElementById('pixelSize');
const pixelSizeValue = document.getElementById('pixelSizeValue');
const emphasizeSimilarityCheckbox = document.getElementById('emphasizeSimilarity');
const similarityThresholdGroup = document.getElementById('similarityThresholdGroup');
const similarityThresholdSlider = document.getElementById('similarityThreshold');
const similarityThresholdValue = document.getElementById('similarityThresholdValue');
const highlightTrendsCheckbox = document.getElementById('highlightTrends');
const trendControlsGroup = document.getElementById('trendControlsGroup');
const trendHorizontalCheckbox = document.getElementById('trendHorizontal');
const trendVerticalCheckbox = document.getElementById('trendVertical');
const trendDiagonalCheckbox = document.getElementById('trendDiagonal');
const trendMinLengthSlider = document.getElementById('trendMinLength');
const trendMinLengthValue = document.getElementById('trendMinLengthValue');
const trendSimilaritySlider = document.getElementById('trendSimilarity');
const trendSimilarityValue = document.getElementById('trendSimilarityValue');
const trendOpacitySlider = document.getElementById('trendOpacity');
const trendOpacityValue = document.getElementById('trendOpacityValue');
const highlightColorInput = document.getElementById('highlightColor');
const view3DCheckbox = document.getElementById('view3D');
const canvasShapeSelect = document.getElementById('canvasShape');
const arrangementPatternSelect = document.getElementById('arrangementPattern');
const randomizeBtn = document.getElementById('randomizeBtn');
const exportImageBtn = document.getElementById('exportImageBtn');
const downloadJsonBtn = document.getElementById('downloadJsonBtn');
const canvas = document.getElementById('colorCanvas');
const ctx = canvas.getContext('2d');
const canvas3DContainer = document.getElementById('canvas3D');
const canvasRGB3DContainer = document.getElementById('canvasRGB3D');
const viewRGB3DCheckbox = document.getElementById('viewRGB3D');
const rgb3DControlsGroup = document.getElementById('rgb3DControlsGroup');
const rgb3DShapeSelect = document.getElementById('rgb3DShape');
const rgb3DShowPathCheckbox = document.getElementById('rgb3DShowPath');
const view3DControlsGroup = document.getElementById('view3DControlsGroup');
const pointSize3DSlider = document.getElementById('pointSize3D');
const pointSize3DValue = document.getElementById('pointSize3DValue');
const showLines3DCheckbox = document.getElementById('showLines3D');
const exportVideo3DCheckbox = document.getElementById('exportVideo3D');
const videoExportControls = document.getElementById('videoExportControls');
const plotSpeed3DSlider = document.getElementById('plotSpeed3D');
const plotSpeed3DValue = document.getElementById('plotSpeed3DValue');
const startVideoExportBtn = document.getElementById('startVideoExportBtn');

function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return Math.abs(hash);
}

function hashToColor(hash) {
    const r = (hash & 0xFF0000) >> 16;
    const g = (hash & 0x00FF00) >> 8;
    const b = hash & 0x0000FF;
    const minBrightness = 50;
    const adjustedR = Math.max(r, minBrightness);
    const adjustedG = Math.max(g, minBrightness);
    const adjustedB = Math.max(b, minBrightness);
    return `#${adjustedR.toString(16).padStart(2, '0')}${adjustedG.toString(16).padStart(2, '0')}${adjustedB.toString(16).padStart(2, '0')}`;
}

function generateRandomColor() {
    const r = Math.floor(Math.random() * 206) + 50;
    const g = Math.floor(Math.random() * 206) + 50;
    const b = Math.floor(Math.random() * 206) + 50;
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : null;
}

function rgbToHex(r, g, b) {
    return `#${[r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    }).join('')}`;
}

function colorDistance(color1, color2) {
    const rgb1 = hexToRgb(color1);
    const rgb2 = hexToRgb(color2);
    if (!rgb1 || !rgb2) return Infinity;
    const dr = rgb1.r - rgb2.r;
    const dg = rgb1.g - rgb2.g;
    const db = rgb1.b - rgb2.b;
    return Math.sqrt(dr * dr + dg * dg + db * db);
}

function getMaxColorDistance() {
    return Math.sqrt(255 * 255 * 3);
}

function emphasizeSimilarColors(colorMap, threshold) {
    if (!emphasizeSimilarity || threshold === 0) {
        return new Map(colorMap);
    }
    const adjustedMap = new Map();
    const maxDistance = getMaxColorDistance();
    const thresholdDistance = (threshold / 100) * maxDistance;
    const clusters = [];
    const processed = new Set();
    colorMap.forEach((color, token) => {
        if (processed.has(token)) return;
        const cluster = [{ token, color }];
        processed.add(token);
        colorMap.forEach((otherColor, otherToken) => {
            if (processed.has(otherToken)) return;
            const distance = colorDistance(color, otherColor);
            if (distance <= thresholdDistance) {
                cluster.push({ token: otherToken, color: otherColor });
                processed.add(otherToken);
            }
        });
        clusters.push(cluster);
    });
    clusters.forEach(cluster => {
        if (cluster.length === 1) {
            adjustedMap.set(cluster[0].token, cluster[0].color);
            return;
        }
        let totalR = 0, totalG = 0, totalB = 0;
        cluster.forEach(({ color }) => {
            const rgb = hexToRgb(color);
            if (rgb) {
                totalR += rgb.r;
                totalG += rgb.g;
                totalB += rgb.b;
            }
        });
        const avgR = totalR / cluster.length;
        const avgG = totalG / cluster.length;
        const avgB = totalB / cluster.length;
        const avgColor = rgbToHex(avgR, avgG, avgB);
        cluster.forEach(({ token }) => {
            adjustedMap.set(token, avgColor);
        });
    });
    return adjustedMap;
}

function tokenize(text) {
    if (!text || text.trim() === '') return [];
    return text.trim().split(/\s+/).filter(token => token.length > 0);
}

function getColorForToken(token, mode) {
    if (tokenColorMap.has(token)) return tokenColorMap.get(token);
    let color;
    if (mode === 'standard') {
        const hash = hashString(token);
        color = hashToColor(hash);
    } else {
        color = generateRandomColor();
    }
    tokenColorMap.set(token, color);
    return color;
}

function calculateCanvasSize(tokens, pixelSize, shape) {
    if (tokens.length === 0) {
        return { width: 0, height: 0, cols: 0, rows: 0, centerX: 0, centerY: 0, radius: 0 };
    }
    let cols, rows, width, height, centerX, centerY, radius;
    switch (shape) {
        case 'square':
            cols = Math.ceil(Math.sqrt(tokens.length));
            rows = Math.ceil(tokens.length / cols);
            width = cols * pixelSize;
            height = rows * pixelSize;
            break;
        case 'rectangle':
            cols = Math.ceil(Math.sqrt(tokens.length * 2));
            rows = Math.ceil(tokens.length / cols);
            width = cols * pixelSize;
            height = rows * pixelSize;
            break;
        case 'tall':
            rows = Math.ceil(Math.sqrt(tokens.length * 2));
            cols = Math.ceil(tokens.length / rows);
            width = cols * pixelSize;
            height = rows * pixelSize;
            break;
        case 'circle':
            const area = tokens.length;
            radius = Math.ceil(Math.sqrt(area / Math.PI)) * pixelSize;
            width = height = radius * 2 + pixelSize;
            centerX = width / 2;
            centerY = height / 2;
            cols = Math.ceil(Math.sqrt(tokens.length));
            rows = Math.ceil(tokens.length / cols);
            break;
        case 'spiral':
            cols = Math.ceil(Math.sqrt(tokens.length));
            rows = Math.ceil(tokens.length / cols);
            width = cols * pixelSize;
            height = rows * pixelSize;
            centerX = width / 2;
            centerY = height / 2;
            break;
        case 'triangle':
            let n = 1;
            while (n * (n + 1) / 2 < tokens.length) n++;
            cols = n;
            rows = n;
            width = cols * pixelSize;
            height = rows * pixelSize;
            break;
        default:
            cols = Math.ceil(Math.sqrt(tokens.length));
            rows = Math.ceil(tokens.length / cols);
            width = cols * pixelSize;
            height = rows * pixelSize;
    }
    return {
        width, height, cols, rows,
        centerX: centerX || width / 2,
        centerY: centerY || height / 2,
        radius: radius || Math.min(width, height) / 2
    };
}

function generatePixelPositions(tokens, canvasInfo, pattern) {
    const positions = [];
    const { cols, rows, width, height, centerX, centerY, radius } = canvasInfo;
    if (pattern === 'row-major') {
        tokens.forEach((token, index) => {
            const row = Math.floor(index / cols);
            const col = index % cols;
            positions.push({ token, row, col, x: col * pixelSize, y: row * pixelSize, valid: true });
        });
    } else if (pattern === 'column-major') {
        tokens.forEach((token, index) => {
            const col = Math.floor(index / rows);
            const row = index % rows;
            positions.push({ token, row, col, x: col * pixelSize, y: row * pixelSize, valid: true });
        });
    } else if (pattern === 'spiral-in') {
        const grid = Array(rows).fill(null).map(() => Array(cols).fill(null));
        let currentRow = 0, currentCol = 0;
        let minRow = 0, maxRow = rows - 1;
        let minCol = 0, maxCol = cols - 1;
        let direction = 0;
        for (let i = 0; i < tokens.length; i++) {
            grid[currentRow][currentCol] = i;
            if (direction === 0) {
                if (currentCol >= maxCol) { direction = 1; minRow++; currentRow++; } else { currentCol++; }
            } else if (direction === 1) {
                if (currentRow >= maxRow) { direction = 2; maxCol--; currentCol--; } else { currentRow++; }
            } else if (direction === 2) {
                if (currentCol <= minCol) { direction = 3; maxRow--; currentRow--; } else { currentCol--; }
            } else {
                if (currentRow <= minRow) { direction = 0; minCol++; currentCol++; } else { currentRow--; }
            }
        }
        grid.forEach((row, r) => {
            row.forEach((index, c) => {
                if (index !== null && index < tokens.length) {
                    positions.push({ token: tokens[index], row: r, col: c, x: c * pixelSize, y: r * pixelSize, valid: true });
                }
            });
        });
    } else if (pattern === 'spiral-out') {
        const grid = Array(rows).fill(null).map(() => Array(cols).fill(null));
        const startRow = Math.floor(rows / 2);
        const startCol = Math.floor(cols / 2);
        let currentRow = startRow, currentCol = startCol;
        let step = 1, stepCount = 0, direction = 0, index = 0;
        if (index < tokens.length && currentRow >= 0 && currentRow < rows && currentCol >= 0 && currentCol < cols) {
            grid[currentRow][currentCol] = index++;
        }
        while (index < tokens.length) {
            if (direction === 0) currentCol++;
            else if (direction === 1) currentRow--;
            else if (direction === 2) currentCol--;
            else currentRow++;
            stepCount++;
            if (currentRow >= 0 && currentRow < rows && currentCol >= 0 && currentCol < cols && index < tokens.length) {
                grid[currentRow][currentCol] = index++;
            }
            if (stepCount >= step) {
                stepCount = 0;
                direction = (direction + 1) % 4;
                if (direction === 0 || direction === 2) step++;
            }
        }
        grid.forEach((row, r) => {
            row.forEach((tokenIndex, c) => {
                if (tokenIndex !== null && tokenIndex < tokens.length) {
                    positions.push({ token: tokens[tokenIndex], row: r, col: c, x: c * pixelSize, y: r * pixelSize, valid: true });
                }
            });
        });
    } else if (pattern === 'zigzag') {
        tokens.forEach((token, index) => {
            const row = Math.floor(index / cols);
            const col = index % cols;
            const actualCol = row % 2 === 0 ? col : cols - 1 - col;
            positions.push({ token, row, col: actualCol, x: actualCol * pixelSize, y: row * pixelSize, valid: true });
        });
    } else if (pattern === 'zigzag-col') {
        tokens.forEach((token, index) => {
            const col = Math.floor(index / rows);
            const row = index % rows;
            const actualRow = col % 2 === 0 ? row : rows - 1 - row;
            positions.push({ token, row: actualRow, col, x: col * pixelSize, y: actualRow * pixelSize, valid: true });
        });
    } else if (pattern === 'diagonal') {
        const grid = Array(rows).fill(null).map(() => Array(cols).fill(null));
        let index = 0;
        for (let sum = 0; sum < rows + cols - 1 && index < tokens.length; sum++) {
            for (let row = 0; row < rows && index < tokens.length; row++) {
                const col = sum - row;
                if (col >= 0 && col < cols) grid[row][col] = index++;
            }
        }
        grid.forEach((row, r) => {
            row.forEach((tokenIndex, c) => {
                if (tokenIndex !== null && tokenIndex < tokens.length) {
                    positions.push({ token: tokens[tokenIndex], row: r, col: c, x: c * pixelSize, y: r * pixelSize, valid: true });
                }
            });
        });
    } else if (pattern === 'random') {
        const used = new Set();
        tokens.forEach((token) => {
            let row, col, key;
            do {
                row = Math.floor(Math.random() * rows);
                col = Math.floor(Math.random() * cols);
                key = `${row},${col}`;
            } while (used.has(key));
            used.add(key);
            positions.push({ token, row, col, x: col * pixelSize, y: row * pixelSize, valid: true });
        });
    }
    return positions;
}

function isValidPosition(pos, canvasInfo, shape) {
    if (!pos.valid) return false;
    const { cols, rows, centerX, centerY, radius } = canvasInfo;
    const { row, col, x, y } = pos;
    switch (shape) {
        case 'circle':
            const dx = x + pixelSize / 2 - centerX;
            const dy = y + pixelSize / 2 - centerY;
            return Math.sqrt(dx * dx + dy * dy) <= radius;
        case 'triangle':
            return col <= row;
        default:
            return row >= 0 && row < rows && col >= 0 && col < cols;
    }
}

function getColorAtPosition(displayColorMap, row, col) {
    const pos = pixelPositions.find(p => p.row === row && p.col === col && p.valid);
    if (pos) return displayColorMap.get(pos.token) || tokenColorMap.get(pos.token);
    return null;
}

function detectTrends(displayColorMap, cols, rows, direction) {
    const trends = [];
    const maxDistance = getMaxColorDistance();
    const thresholdDistance = (trendSimilarity / 100) * maxDistance;
    if (direction === 'horizontal') {
        for (let row = 0; row < rows; row++) {
            let currentTrend = [], lastColor = null;
            for (let col = 0; col < cols; col++) {
                const color = getColorAtPosition(displayColorMap, row, col);
                if (!color) continue;
                if (lastColor === null) {
                    currentTrend.push({ row, col, color });
                    lastColor = color;
                } else {
                    const distance = colorDistance(color, lastColor);
                    if (distance <= thresholdDistance) currentTrend.push({ row, col, color });
                    else {
                        if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
                        currentTrend = [{ row, col, color }];
                        lastColor = color;
                    }
                }
            }
            if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
        }
    } else if (direction === 'vertical') {
        for (let col = 0; col < cols; col++) {
            let currentTrend = [], lastColor = null;
            for (let row = 0; row < rows; row++) {
                const color = getColorAtPosition(displayColorMap, row, col);
                if (!color) continue;
                if (lastColor === null) {
                    currentTrend.push({ row, col, color });
                    lastColor = color;
                } else {
                    const distance = colorDistance(color, lastColor);
                    if (distance <= thresholdDistance) currentTrend.push({ row, col, color });
                    else {
                        if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
                        currentTrend = [{ row, col, color }];
                        lastColor = color;
                    }
                }
            }
            if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
        }
    } else if (direction === 'diagonal') {
        for (let startRow = 0; startRow < rows; startRow++) {
            let currentTrend = [], lastColor = null;
            for (let offset = 0; offset < Math.min(rows - startRow, cols); offset++) {
                const row = startRow + offset, col = offset;
                const color = getColorAtPosition(displayColorMap, row, col);
                if (!color) continue;
                if (lastColor === null) { currentTrend.push({ row, col, color }); lastColor = color; }
                else {
                    const distance = colorDistance(color, lastColor);
                    if (distance <= thresholdDistance) currentTrend.push({ row, col, color });
                    else { if (currentTrend.length >= trendMinLength) trends.push(currentTrend); currentTrend = [{ row, col, color }]; lastColor = color; }
                }
            }
            if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
        }
        for (let startCol = 1; startCol < cols; startCol++) {
            let currentTrend = [], lastColor = null;
            for (let offset = 0; offset < Math.min(rows, cols - startCol); offset++) {
                const row = offset, col = startCol + offset;
                const color = getColorAtPosition(displayColorMap, row, col);
                if (!color) continue;
                if (lastColor === null) { currentTrend.push({ row, col, color }); lastColor = color; }
                else {
                    const distance = colorDistance(color, lastColor);
                    if (distance <= thresholdDistance) currentTrend.push({ row, col, color });
                    else { if (currentTrend.length >= trendMinLength) trends.push(currentTrend); currentTrend = [{ row, col, color }]; lastColor = color; }
                }
            }
            if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
        }
        for (let startRow = 0; startRow < rows; startRow++) {
            let currentTrend = [], lastColor = null;
            for (let offset = 0; offset < Math.min(rows - startRow, cols); offset++) {
                const row = startRow + offset, col = cols - 1 - offset;
                const color = getColorAtPosition(displayColorMap, row, col);
                if (!color) continue;
                if (lastColor === null) { currentTrend.push({ row, col, color }); lastColor = color; }
                else {
                    const distance = colorDistance(color, lastColor);
                    if (distance <= thresholdDistance) currentTrend.push({ row, col, color });
                    else { if (currentTrend.length >= trendMinLength) trends.push(currentTrend); currentTrend = [{ row, col, color }]; lastColor = color; }
                }
            }
            if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
        }
        for (let startCol = cols - 2; startCol >= 0; startCol--) {
            let currentTrend = [], lastColor = null;
            for (let offset = 0; offset < Math.min(rows, startCol + 1); offset++) {
                const row = offset, col = startCol - offset;
                const color = getColorAtPosition(displayColorMap, row, col);
                if (!color) continue;
                if (lastColor === null) { currentTrend.push({ row, col, color }); lastColor = color; }
                else {
                    const distance = colorDistance(color, lastColor);
                    if (distance <= thresholdDistance) currentTrend.push({ row, col, color });
                    else { if (currentTrend.length >= trendMinLength) trends.push(currentTrend); currentTrend = [{ row, col, color }]; lastColor = color; }
                }
            }
            if (currentTrend.length >= trendMinLength) trends.push(currentTrend);
        }
    }
    return trends;
}

function hexToRgbForHighlight(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 0 };
}

function drawTrendHighlights(trends) {
    if (!highlightTrends || trends.length === 0) return;
    const rgb = hexToRgbForHighlight(highlightColorHex);
    const highlightColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${trendOpacity / 100})`;
    const borderColor = `rgba(${Math.max(0, rgb.r - 55)}, ${Math.max(0, rgb.g - 55)}, ${Math.max(0, rgb.b - 55)}, ${Math.min(trendOpacity / 100 + 0.2, 1)})`;
    trends.forEach(trend => {
        trend.forEach(({ row, col }) => {
            const pos = pixelPositions.find(p => p.row === row && p.col === col && p.valid);
            if (!pos) return;
            ctx.fillStyle = highlightColor;
            ctx.fillRect(pos.x, pos.y, pixelSize, pixelSize);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1;
            ctx.strokeRect(pos.x, pos.y, pixelSize, pixelSize);
        });
    });
}

        const linePositions = new Float32Array(positions.length * 3);
        positions.forEach((pos, i) => { linePositions[i * 3] = pos.x; linePositions[i * 3 + 1] = pos.y; linePositions[i * 3 + 2] = pos.z; });
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        const line = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({ color: 0x888888, opacity: 0.5, transparent: true }));
        line.userData.isPathLine = true;
        scene3D.add(line);
    }
    if (highlightTrends) {
        const allTrends = [];
        if (trendHorizontal) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'horizontal'));
        if (trendVertical) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'vertical'));
        if (trendDiagonal) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'diagonal'));
        const rgb = hexToRgbForHighlight(highlightColorHex);
        const highlightMaterial = new THREE.MeshStandardMaterial({
            color: new THREE.Color(rgb.r / 255, rgb.g / 255, rgb.b / 255),
            emissive: new THREE.Color(rgb.r / 255, rgb.g / 255, rgb.b / 255),
            emissiveIntensity: trendOpacity / 100
        });
        allTrends.forEach(trend => {
            trend.forEach(({ row, col }) => {
                const pos = pixelPositions.find(p => p.row === row && p.col === col && p.valid);
                if (!pos) return;
                const x = (pos.col - cols / 2) * spacing, y = (rows / 2 - pos.row) * spacing;
                scene3D.children.forEach(child => {
                    if (child instanceof THREE.Mesh && Math.abs(child.position.x - x) < 0.01 && Math.abs(child.position.y - y) < 0.01) child.material = highlightMaterial;
                });
            });
        });
    }
    let animationId;
    function animate() {
        if (!view3D || !renderer3D) return;
        animationId = requestAnimationFrame(animate);
        if (controls3D && controls3D.update) controls3D.update();
        renderer3D.render(scene3D, camera3D);
    }
    animate();
}

function renderCanvas() {
    if (viewRGB3D) { renderCanvasRGB3D(); return; }
    if (view3D) { renderCanvas3D(); return; }
    tokens = tokenize(textInput.value);
    if (tokens.length === 0) { canvas.width = 0; canvas.height = 0; return; }
    tokens.forEach(token => getColorForToken(token, currentMode));
    const displayColorMap = emphasizeSimilarColors(tokenColorMap, similarityThreshold);
    const canvasInfo = calculateCanvasSize(tokens, pixelSize, canvasShape);
    const { width, height, cols, rows } = canvasInfo;
    canvas.width = width;
    canvas.height = height;
    pixelPositions = generatePixelPositions(tokens, canvasInfo, arrangementPattern);
    pixelPositions = pixelPositions.map(pos => ({ ...pos, valid: isValidPosition(pos, canvasInfo, canvasShape) }));
    ctx.clearRect(0, 0, width, height);
    pixelPositions.forEach((pos) => {
        if (!pos.valid) return;
        const color = displayColorMap.get(pos.token) || tokenColorMap.get(pos.token);
        ctx.fillStyle = color;
        ctx.fillRect(pos.x, pos.y, pixelSize, pixelSize);
    });
    if (highlightTrends) {
        const allTrends = [];
        if (trendHorizontal) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'horizontal'));
        if (trendVertical) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'vertical'));
        if (trendDiagonal) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'diagonal'));
        allTrends.forEach(trend => drawTrendHighlights([trend]));
    }
}

function exportVideo3DView() {
    if (!view3D || !scene3D || !renderer3D) { alert('Please enable 3D View first.'); return; }
    if (!HTMLCanvasElement.prototype.captureStream) { alert('Video recording is not supported in this browser.'); return; }
    tokens = tokenize(textInput.value);
    if (tokens.length === 0) { alert('No tokens to export. Please enter some text first.'); return; }
    tokens.forEach(token => getColorForToken(token, currentMode));
    const displayColorMap = emphasizeSimilarColors(tokenColorMap, similarityThreshold);
    const canvasInfo = calculateCanvasSize(tokens, pixelSize, canvasShape);
    const { cols, rows } = canvasInfo;
    pixelPositions = generatePixelPositions(tokens, canvasInfo, arrangementPattern);
    pixelPositions = pixelPositions.map(pos => ({ ...pos, valid: isValidPosition(pos, canvasInfo, canvasShape) }));
    const validPositions = pixelPositions.filter(pos => pos.valid);
    if (validPositions.length === 0) { alert('No valid positions to plot.'); return; }
    while(scene3D.children.length > 2) scene3D.remove(scene3D.children[scene3D.children.length - 1]);
    const cubeSize = pointSize3D, spacing = cubeSize * 1.2;
    const positions = [];
    validPositions.forEach((pos, index) => {
        const x = (pos.col - cols / 2) * spacing, y = (rows / 2 - pos.row) * spacing, z = 0;
        positions.push({ x, y, z, pos, index, color: displayColorMap.get(pos.token) || tokenColorMap.get(pos.token) });
    });
    let stream;
    try { stream = renderer3D.domElement.captureStream(30); } catch (e) { alert('Failed to capture stream.'); return; }
    recordedChunks = [];
    let mimeType = 'video/webm;codecs=vp9';
    if (!MediaRecorder.isTypeSupported(mimeType)) { mimeType = 'video/webm;codecs=vp8'; if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm'; }
    try { mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType }); } catch (e) { alert('Failed to create MediaRecorder.'); return; }
    mediaRecorder.ondataavailable = (event) => { if (event.data && event.data.size > 0) recordedChunks.push(event.data); };
    mediaRecorder.onstop = () => {
        if (recordedChunks.length === 0) { alert('No video data recorded.'); isRecordingVideo = false; startVideoExportBtn.textContent = 'Start Video Export'; startVideoExportBtn.disabled = false; return; }
        const blob = new Blob(recordedChunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = generateRandomFilename('video.webm');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        isRecordingVideo = false;
        startVideoExportBtn.textContent = 'Start Video Export';
        startVideoExportBtn.disabled = false;
    };
    mediaRecorder.onerror = (event) => { isRecordingVideo = false; startVideoExportBtn.textContent = 'Start Video Export'; startVideoExportBtn.disabled = false; };
    try { mediaRecorder.start(); } catch (e) { alert('Failed to start recording.'); return; }
    isRecordingVideo = true;
    startVideoExportBtn.textContent = 'Recording...';
    startVideoExportBtn.disabled = true;
    let currentIndex = 0;
    const cubes = [];
    let pathLine = null;
    const fps = 30, frameDelay = 1000 / fps;
    let lastFrameTime = performance.now();
    function animatePlotting() {
        if (!isRecordingVideo) { if (animationFrameId) cancelAnimationFrame(animationFrameId); return; }
        const now = performance.now(), elapsed = now - lastFrameTime;
        if (elapsed >= frameDelay) {
            if (currentIndex >= positions.length) {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                }, 1000);
                return;
            }
            const pointsToAdd = Math.max(1, Math.ceil(plotSpeed3D));
            for (let i = 0; i < pointsToAdd && currentIndex < positions.length; i++) {
                const { x, y, z, color } = positions[currentIndex];
                const cube = new THREE.Mesh(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize), new THREE.MeshStandardMaterial({ color: color }));
                cube.position.set(x, y, z);
                cube.userData.isTokenPoint = true;
                scene3D.add(cube);
                cubes.push(cube);
                currentIndex++;
            }
            if (showLines3D && cubes.length > 1) {
                if (pathLine) scene3D.remove(pathLine);
                const lineGeometry = new THREE.BufferGeometry();
                const linePositions = new Float32Array(cubes.length * 3);
                cubes.forEach((cube, i) => { linePositions[i * 3] = cube.position.x; linePositions[i * 3 + 1] = cube.position.y; linePositions[i * 3 + 2] = cube.position.z; });
                lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
                pathLine = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({ color: 0x888888, opacity: 0.5, transparent: true }));
                pathLine.userData.isPathLine = true;
                scene3D.add(pathLine);
            }
            lastFrameTime = now;
        }
        renderer3D.render(scene3D, camera3D);
        animationFrameId = requestAnimationFrame(animatePlotting);
    }
    while(scene3D.children.length > 2) scene3D.remove(scene3D.children[scene3D.children.length - 1]);
    lastFrameTime = performance.now();
    animatePlotting();
}

function randomizeColors() { tokenColorMap.clear(); renderCanvas(); }

function exportHighResImage() {
    if (tokens.length === 0) { alert('No tokens to export. Please enter some text first.'); return; }
    const displayColorMap = emphasizeSimilarColors(tokenColorMap, similarityThreshold);
    const canvasInfo = calculateCanvasSize(tokens, pixelSize, canvasShape);
    const { width, height, cols, rows } = canvasInfo;
    const exportPixelPositions = generatePixelPositions(tokens, canvasInfo, arrangementPattern);
    const filteredPositions = exportPixelPositions.map(pos => ({ ...pos, valid: isValidPosition(pos, canvasInfo, canvasShape) }));
    const scale = 4;
    const highResCanvas = document.createElement('canvas');
    const highResCtx = highResCanvas.getContext('2d');
    highResCanvas.width = width * scale;
    highResCanvas.height = height * scale;
    filteredPositions.forEach((pos) => {
        if (!pos.valid) return;
        const color = displayColorMap.get(pos.token) || tokenColorMap.get(pos.token);
        highResCtx.fillStyle = color;
        highResCtx.fillRect(pos.x * scale, pos.y * scale, pixelSize * scale, pixelSize * scale);
    });
    if (highlightTrends) {
        const allTrends = [];
        if (trendHorizontal) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'horizontal'));
        if (trendVertical) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'vertical'));
        if (trendDiagonal) allTrends.push(...detectTrends(displayColorMap, cols, rows, 'diagonal'));
        const rgb = hexToRgbForHighlight(highlightColorHex);
        const highlightColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${trendOpacity / 100})`;
        const borderColor = `rgba(${Math.max(0, rgb.r - 55)}, ${Math.max(0, rgb.g - 55)}, ${Math.max(0, rgb.b - 55)}, ${Math.min(trendOpacity / 100 + 0.2, 1)})`;
        allTrends.forEach(trend => {
            trend.forEach(({ row, col }) => {
                const pos = filteredPositions.find(p => p.row === row && p.col === col);
                if (pos && pos.valid) {
                    const x = pos.x * scale, y = pos.y * scale;
                    highResCtx.fillStyle = highlightColor;
                    highResCtx.fillRect(x, y, pixelSize * scale, pixelSize * scale);
                    highResCtx.strokeStyle = borderColor;
                    highResCtx.lineWidth = scale;
                    highResCtx.strokeRect(x, y, pixelSize * scale, pixelSize * scale);
                }
            });
        });
    }
    const filename = generateRandomFilename('image.png');
    highResCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
}

function generateRandomFilename(extension) {
    if (tokens.length === 0) {
        const date = new Date();
        return `token_${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}${date.getFullYear()}_${extension}`;
    }
    const shuffled = [...tokens].sort(() => 0.5 - Math.random());
    const selectedTokens = shuffled.slice(0, Math.min(3, tokens.length));
    const tokenNames = selectedTokens.map(t => t.replace(/[^a-zA-Z0-9]/g, '_')).join('');
    const date = new Date();
    return `${tokenNames}_${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}${date.getFullYear()}_${extension}`;
}

function downloadColorMapping() {
    if (tokenColorMap.size === 0) { alert('No color mapping to download. Please enter some text first.'); return; }
    const mapping = {};
    tokenColorMap.forEach((color, token) => { mapping[token] = color; });
    const json = JSON.stringify(mapping, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = generateRandomFilename('map.json');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

textInput.addEventListener('input', () => renderCanvas());
modeSelect.addEventListener('change', (e) => { currentMode = e.target.value; tokenColorMap.clear(); renderCanvas(); });
pixelSizeSlider.addEventListener('input', (e) => { pixelSize = parseInt(e.target.value); pixelSizeValue.textContent = pixelSize; renderCanvas(); });
canvasShapeSelect.addEventListener('change', (e) => { canvasShape = e.target.value; renderCanvas(); });
arrangementPatternSelect.addEventListener('change', (e) => { arrangementPattern = e.target.value; renderCanvas(); });
emphasizeSimilarityCheckbox.addEventListener('change', (e) => { emphasizeSimilarity = e.target.checked; similarityThresholdGroup.style.display = emphasizeSimilarity ? 'block' : 'none'; renderCanvas(); });
similarityThresholdSlider.addEventListener('input', (e) => { similarityThreshold = parseInt(e.target.value); similarityThresholdValue.textContent = similarityThreshold; renderCanvas(); });
highlightTrendsCheckbox.addEventListener('change', (e) => { highlightTrends = e.target.checked; trendControlsGroup.style.display = highlightTrends ? 'block' : 'none'; renderCanvas(); });
trendHorizontalCheckbox.addEventListener('change', (e) => { trendHorizontal = e.target.checked; renderCanvas(); });
trendVerticalCheckbox.addEventListener('change', (e) => { trendVertical = e.target.checked; renderCanvas(); });
trendDiagonalCheckbox.addEventListener('change', (e) => { trendDiagonal = e.target.checked; renderCanvas(); });
trendMinLengthSlider.addEventListener('input', (e) => { trendMinLength = parseInt(e.target.value); trendMinLengthValue.textContent = trendMinLength; renderCanvas(); });
trendSimilaritySlider.addEventListener('input', (e) => { trendSimilarity = parseInt(e.target.value); trendSimilarityValue.textContent = trendSimilarity; renderCanvas(); });
trendOpacitySlider.addEventListener('input', (e) => { trendOpacity = parseInt(e.target.value); trendOpacityValue.textContent = trendOpacity; renderCanvas(); });
highlightColorInput.addEventListener('input', (e) => { highlightColorHex = e.target.value; renderCanvas(); });
view3DCheckbox.addEventListener('change', (e) => {
    view3D = e.target.checked;
    if (view3D) {
        viewRGB3D = false;
        viewRGB3DCheckbox.checked = false;
        rgb3DControlsGroup.style.display = 'none';
        view3DControlsGroup.style.display = 'block';
        canvas.style.display = 'none';
        canvasRGB3DContainer.style.display = 'none';
        canvas3DContainer.style.display = 'block';
        if (!window.THREE) { alert('Three.js library failed to load.'); view3D = false; view3DCheckbox.checked = false; return; }
        init3DView();
        renderCanvas3D();
    } else {
        view3DControlsGroup.style.display = 'none';
        if (!viewRGB3D) canvas.style.display = 'block';
        canvas3DContainer.style.display = 'none';
        if (controls3D && controls3D.dispose) controls3D.dispose();
        if (renderer3D) renderer3D.dispose();
    }
});
pointSize3DSlider.addEventListener('input', (e) => { pointSize3D = parseFloat(e.target.value); pointSize3DValue.textContent = pointSize3D.toFixed(2); renderCanvas(); });
showLines3DCheckbox.addEventListener('change', (e) => { showLines3D = e.target.checked; renderCanvas(); });
exportVideo3DCheckbox.addEventListener('change', (e) => { exportVideo3D = e.target.checked; videoExportControls.style.display = exportVideo3D ? 'block' : 'none'; });
plotSpeed3DSlider.addEventListener('input', (e) => { plotSpeed3D = parseFloat(e.target.value); plotSpeed3DValue.textContent = plotSpeed3D.toFixed(1); });
startVideoExportBtn.addEventListener('click', () => { if (!isRecordingVideo) exportVideo3DView(); });
viewRGB3DCheckbox.addEventListener('change', (e) => {
    viewRGB3D = e.target.checked;
    if (viewRGB3D) {
        view3D = false;
        view3DCheckbox.checked = false;
        canvas.style.display = 'none';
        canvas3DContainer.style.display = 'none';
        canvasRGB3DContainer.style.display = 'block';
        rgb3DControlsGroup.style.display = 'block';
        if (!window.THREE) { alert('Three.js library failed to load.'); viewRGB3D = false; viewRGB3DCheckbox.checked = false; return; }
        initRGB3DView();
        renderCanvasRGB3D();
    } else {
        rgb3DControlsGroup.style.display = 'none';
        if (!view3D) canvas.style.display = 'block';
        canvasRGB3DContainer.style.display = 'none';
        if (animationIdRGB3D) { cancelAnimationFrame(animationIdRGB3D); animationIdRGB3D = null; }
        if (controlsRGB3D && controlsRGB3D.dispose) controlsRGB3D.dispose();
        if (rendererRGB3D) rendererRGB3D.dispose();
    }
});
rgb3DShapeSelect.addEventListener('change', (e) => { rgb3DShape = e.target.value; renderCanvas(); });
rgb3DShowPathCheckbox.addEventListener('change', (e) => { rgb3DShowPath = e.target.checked; renderCanvas(); });
randomizeBtn.addEventListener('click', () => { if (currentMode === 'random') randomizeColors(); else alert('Re-randomization only works in Random mode.'); });
exportImageBtn.addEventListener('click', exportHighResImage);
downloadJsonBtn.addEventListener('click', downloadColorMapping);

window.addEventListener('resize', () => {
    if (view3D && renderer3D && camera3D) {
        const container = canvas3DContainer;
        const width = container.clientWidth, height = container.clientHeight || 600;
        camera3D.aspect = width / height;
        camera3D.updateProjectionMatrix();
        renderer3D.setSize(width, height);
    }
    if (viewRGB3D && rendererRGB3D && cameraRGB3D) {
        const container = canvasRGB3DContainer;
        const width = container.clientWidth, height = container.clientHeight || 600;
        cameraRGB3D.aspect = width / height;
        cameraRGB3D.updateProjectionMatrix();
        rendererRGB3D.setSize(width, height);
    }
});

renderCanvas();
    </script>
